[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    # Loads a real model (onnxruntime, tens of MB of weights). Takes seconds,
    # so it is excluded from a quick run: pytest -m "not slow".
    slow: tests that need a real model or a real microphone
