# JARVIS configuration.
#
# Everything here is meant to be edited. Changing a threshold, a model name, or
# a tone should be a one-line edit — never a code change. See AGENT.md.

assistant:
  name: JARVIS
  purpose: >-
    A voice-first personal assistant. You help me with three things first:
    answering my messages, opening and managing my apps, notes and documents,
    and telling me the time and weather.
  tone: >-
    Crisp and professional. Direct, competent, no filler. Short sentences.
    State what you did and what you need. Never pad a reply, never open with
    pleasantries, and never restate my question back to me.

brain:
  # Which provider to use: "gemini" (cloud) or "ollama" (local, offline).
  provider: gemini

  # Shared generation settings, applied to whichever provider is selected.
  temperature: 0.7
  max_output_tokens: 2048
  # Seconds to wait on the model before giving up with a clear message.
  timeout_seconds: 60

  gemini:
    # Gemini 3 Pro was requested, but the Pro preview model has NO quota on a
    # free-tier key — every call returns 429 RESOURCE_EXHAUSTED — and its
    # earlier endpoint (gemini-3-pro-preview) has been shut down by Google.
    #
    # Verified against this key: gemini-3.5-flash, gemini-3.5-flash-lite and
    # gemini-3.6-flash all answer. The free tier also has a *daily* request cap
    # shared across models, so a busy day can exhaust it — if that happens,
    # switch to another model here or wait for the reset at midnight Pacific.
    #
    # Swap this one line when Pro quota is available on your plan — the model
    # name lives here precisely so that is a one-line change.
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta

  ollama:
    # Local fallback — needs no API key. Handy for offline development and for
    # verifying the harness when no cloud key is configured.
    model: qwen2.5-coder:3b
    base_url: http://localhost:11434
