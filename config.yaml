# JARVIS configuration.
#
# Everything here is meant to be edited. Changing a threshold, a model name, or
# a tone should be a one-line edit — never a code change. See AGENT.md.

assistant:
  name: JARVIS
  purpose: >-
    A voice-first personal assistant. You help me with three things first:
    answering my messages, opening and managing my apps, notes and documents,
    and telling me the time and weather.
  tone: >-
    Formal and plain. You are a British valet: respectful, economical, and calm.
    Address me as "sir". Never enthusiastic, never chatty, never obsequious.
    State what you did and what you need, in short sentences. The full character
    lives in personality.md — this is only the summary.

brain:
  # Which provider to use: "gemini" (cloud) or "ollama" (local, offline).
  provider: gemini

  # Shared generation settings, applied to whichever provider is selected.
  temperature: 0.7
  max_output_tokens: 2048
  # Seconds to wait on the model before giving up with a clear message.
  timeout_seconds: 120

  gemini:
    # Gemini 3 Pro was requested, but the Pro preview model has NO quota on a
    # free-tier key — every call returns 429 RESOURCE_EXHAUSTED — and its
    # earlier endpoint (gemini-3-pro-preview) has been shut down by Google.
    #
    # Verified against this key: gemini-3.5-flash, gemini-3.5-flash-lite and
    # gemini-3.6-flash all answer. The free tier also has a *daily* request cap
    # shared across models, so a busy day can exhaust it — if that happens,
    # switch to another model here or wait for the reset at midnight Pacific.
    #
    # Swap this one line when Pro quota is available on your plan — the model
    # name lives here precisely so that is a one-line change.
    # gemini-3.5-flash-lite has the most headroom on a free-tier key.
    # Verified working: 3.5-flash-lite, 3.6-flash, 3.1-flash-lite-preview.
    model: gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta

  ollama:
    # Local fallback — needs no API key. Handy for offline development and for
    # verifying the harness when no cloud key is configured.
    # A small model on CPU is slow to first token; raise brain.timeout_seconds
    # above (e.g. 300) if you use this as your daily brain.
    model: qwen2.5-coder:3b
    base_url: http://localhost:11434

# ---------------------------------------------------------------------------
# The ears — speech to text.
# ---------------------------------------------------------------------------
stt:
  # "deepgram" — cloud, ~1s per utterance. Needs DEEPGRAM_API_KEY in .env.
  # "whisper"  — entirely local, no key, no network, but ~10s per utterance on
  #              CPU. Keep this as the offline fallback: if Deepgram is down or
  #              you have no connection, switch back here and it just works.
  provider: deepgram

  whisper:
    # tiny.en / base.en / small.en — bigger is more accurate and slower.
    model: base.en
    device: cpu
    compute_type: int8

  deepgram:
    # nova-3 is the current flagship: lower latency, better on noisy audio.
    # Fall back to nova-2 if your account does not have nova-3.
    model: nova-3
    language: en
    timeout_seconds: 60
    api_key_env: DEEPGRAM_API_KEY

# ---------------------------------------------------------------------------
# The mouth — text to speech.
# ---------------------------------------------------------------------------
tts:
  provider: fish
  voice: "14129c3e320149449d6bada6862f7338"
  # "espeak" — local, instant, no key, no network. Robotic but dependable.
  # "edge"  — free Microsoft neural voices. No key, needs network. Much more
  #           natural than espeak; switch here to try it.
  # "piper" — fully offline neural voices. No key, no network, very fast.
  # "elevenlabs" — the most natural of all; needs ELEVENLABS_API_KEY in .env.
  #           Check which voices your key can use with: jarvis --voices
  # "fish"     — high-quality free tier (s2.1-pro-free). Needs FISH_API_KEY.
  #           Browse voices at: https://fish.audio/library

  edge:
    # Browse voices: .venv/bin/python -m edge_tts --list-voices
    # Good British male: en-GB-RyanNeural, en-GB-ThomasNeural
    # Good American male: en-US-AndrewNeural, en-US-BrianNeural
    # Good British female: en-GB-SoniaNeural, en-GB-LibbyNeural
    voice: en-GB-RyanNeural
    rate_str: "+8%"     # slightly brisk — assistants should not dawdle
    volume: "+0%"
    pitch: "+0Hz"

  piper:
    # Download a voice first:
    #   .venv/bin/python -c "from pathlib import Path; \
    #     from piper.download_voices import download_voice; \
    #     download_voice('en_GB-alan-medium', Path.home()/'.local/share/piper-voices')"
    voice: en_GB-alan-medium
    # >1.0 slows speech down, <1.0 speeds it up.
    length_scale: 1.0

  espeak:
    voice: en-gb
    rate: 165

  elevenlabs:
    # Daniel — British, measured, newsreader cadence. The closest stock voice to
    # the JARVIS register. Voices from the public library are NOT usable via the
    # API on a free plan: they return 402 "paid_plan_required".
    # Alternatives, all verified working on this key:
    #   George  JBFqnCBsd6RMkjVDRZzb  warm British narrator
    #   Callum  N2lVS1w4EtoT3dr4eOWO  British
    #   Charlie IKne3meq5aSn9XLyUdCD  British
    # List what your key can use with:  .venv/bin/python -m jarvis --voices
    voice: onwK4e9ZLuTAKqWW03F9
    model: eleven_flash_v2_5
    timeout_seconds: 60
    api_key_env: ELEVENLABS_API_KEY

  fish:
    # High-quality free neural voices. Browse voices at fish.audio/library.
    # The voice ID is the 32-character hash in the URL, e.g.:
    #   https://fish.audio/m/14129c3e320149449d6bada6862f7338
    voice: 14129c3e320149449d6bada6862f7338
    model: s2.1-pro-free  # free tier
    api_key_env: FISH_API_KEY

# ---------------------------------------------------------------------------
# The voice interface itself.
# ---------------------------------------------------------------------------
voice:
  # Hold to talk, release to send. Push-to-talk first: it removes a whole class
  # of "is it listening?" bugs.
  #
  # NOT space. A bare space fires on every keystroke once this runs outside a
  # terminal, which is exactly what happened the first time it was backgrounded.
  # A single key ("f9") or a combination ("<ctrl>+<alt>+j") both work.
  ptt_key: f9
  # Press to cut JARVIS off mid-sentence (and to quit when it is silent).
  interrupt_key: esc
  # Say his name instead of holding a key. Run with:  ./jarvis-wake
  # Works with no key at all (openWakeWord, offline). Set PORCUPINE_ACCESS_KEY
  # to switch to Porcupine, which is cheaper on CPU.
  #
  # IMPORTANT: the openWakeWord model is trained on "hey jarvis" — say "hey
  # jarvis", not "jarvis". Plain "jarvis" scores ~0.09 and will never wake him.
  # (Porcupine's keyword is plain "jarvis", so the two differ here.)
  wake_word: hey jarvis
  # openWakeWord: the score threshold. Measured on real speech — "hey jarvis"
  # reaches ~0.5-0.9, ordinary sentences stay under 0.1. 0.4 sits between them.
  # Porcupine: 0.0 = fewest false wakes but most misses; 1.0 = the reverse.
  wake_sensitivity: 0.4
  speak_replies: true
  # Print what it *thought* you said next to the reply. Keep this on while
  # building: when it answers the wrong question, it shows whether the ears or
  # the brain was at fault.
  show_transcript: true
  # Print a cue the moment you release the key, so silence never reads as
  # "it broke".
  thinking_cue: true
  min_sentence_chars: 2

# ---------------------------------------------------------------------------
# The board of advisors.
#
# Each seat writes a position, reasoning, citations, confidence, a falsifier
# and an abstention flag in one call. That is a lot of text, so the seat budget
# is deliberately much larger than the brain's — at 2048 the reasoning was
# being cut mid-sentence and the opinion read as broken in the inbox.
# ---------------------------------------------------------------------------
board:
  # Output limit per seat call. 8192 leaves room for the full structure.
  max_output_tokens: 8192
  # Output limit for the chair's synthesis. Smaller: it writes a summary.
  chair_max_output_tokens: 4096
  # Hard ceiling for one whole meeting (all seats + chair), in USD.
  max_cost_usd: 0.50


# ---------------------------------------------------------------------------
# The business's own online surfaces.
#
# Filling these in lets JARVIS answer "how is the business looking online?"
# without being told what to look at, and lets the heartbeat check them
# proactively. Both are optional.
#
# youtube_channel accepts a handle (@minurostudio), a channel URL, or a
# channel id — the handle is resolved once and cached.
# ---------------------------------------------------------------------------
presence:
  # The business's own online surfaces, so JARVIS knows what to check without
  # being told each time. A business can run more than one brand, so the plural
  # lists are the real targets — the singular fields below are still honoured
  # and merged in, so an older config keeps working.
  #
  # Add a second site or channel by appending a line. YouTube accepts a handle
  # (@name), a channel URL, or a channel id.
  websites:
    - https://minuro.vercel.app/
    - https://kingmike.vercel.app/
  youtube_channels:
    - https://www.youtube.com/@MINUROStudio
    - https://www.youtube.com/@KingMike-w8s

  # Kept for compatibility; merged into the lists above.
  website_url: https://minuro.vercel.app/
  youtube_channel: https://www.youtube.com/@MINUROStudio


# ---------------------------------------------------------------------------
# The heartbeat — the assistant reaching out on its own.
#
# Quiet by default: it earns the right to interrupt, it does not assume it.
# ---------------------------------------------------------------------------
heartbeat:
  # Master switch. Also toggled at runtime by the PAUSED file (the kill switch):
  #   touch state/PAUSED     # stop all proactive behaviour
  #   rm state/PAUSED        # resume
  enabled: true

  # How often the loop wakes to see whether anything is due.
  poll_seconds: 5

  # Non-urgent notices wait for waking hours. Only "urgent" interrupts at night.
  quiet_hours_enabled: true
  quiet_hours_start: "22:00"
  quiet_hours_end: "07:00"

  # Show what was noticed while you were away, on return. This is the
  # catch-up-on-return path — notices are held, never delivered once and lost.
  catch_up_on_start: true

  # Each check: what to look at, how often, and whether it is worth surfacing.
  # Tune these freely — nothing here needs a code change.
  checks:
    clock:
      enabled: true
      # A deliberately trivial check, for verifying the loop end to end.
      # Create the trigger file to make it fire on purpose:
      #   echo "testing" > /tmp/jarvis-trigger
      interval_seconds: 60
      trigger_file: /tmp/jarvis-trigger
      trigger_title: "Test condition met"
      # quiet | normal | urgent — how much this may intrude.
      level: normal

    notes:
      enabled: true
      interval_seconds: 3600
      # Surface only once the note count reaches this.
      threshold: 10
      level: quiet

    # Watches the business's own website and YouTube channel. Quiet by design:
    # it speaks only when something changes — the site goes down, a new video
    # appears, a page breaks, or the channel goes quiet.
    presence:
      enabled: true
      interval_seconds: 86400  # daily
      level: normal

    messages:
      enabled: true
      interval_seconds: 900
      # Only flag unread messages older than this. A check that fires the
      # instant anything arrives is a notification, not an assistant.
      min_age_minutes: 60
      level: normal

    # The scout — a scheduled research sub-agent. It hunts for competitor and
    # product news using free sources, scores what it finds against the rubric
    # in jarvis/scout/DOCTRINE.md, and surfaces only what clears the bar.
    #
    # It never acts on a find: it recommends, you decide. Most runs surface
    # nothing, which is the intended behaviour, not a failure.
    scout:
      enabled: true
      # Six hours. Research is not urgent, and each run costs model calls.
      interval_seconds: 21600
      # What to hunt for. Plain language — the doctrine turns this into
      # searches. Narrow this to your actual competitors for better signal.
      query: competitor and product news
      # Research-tool rounds before the loop gives up. Each round is one
      # search plus reading. 12 is generous; 8 is usually plenty.
      max_iterations: 12
      # Wall-clock ceiling for one run. The loop stops cleanly at this point
      # rather than being killed mid-flight.
      timeout_s: 180
      level: quiet

    # The board's standing review — a monthly pass over every dossier, checking
    # whether the doctrine still holds. Needs dossiers and a provider.
    board-standing-review:
      enabled: true
      # 30 days. This is a slow, deliberate check, not a frequent one.
      interval_seconds: 2592000
      level: quiet

# ---------------------------------------------------------------------------
# The rails — safety, confirmation, and the audit trail.
#
# This is less new machinery than a posture applied across everything: the
# confirmation gate sits between the model choosing a tool and the tool running,
# so it covers typed, spoken, and heartbeat-initiated actions alike.
# ---------------------------------------------------------------------------
rails:
  # Hard gate on anything that sends, spends, deletes, or changes a setting.
  # Read-only actions flow freely. Turning this off is possible but is a
  # deliberate, visible edit — which is the point.
  confirm_consequential: true

  # Plain-text record of what ran, what was surfaced, and what was asked.
  audit_log: true

  # Running tally of model cost, so a runaway loop is visible immediately.
  show_cost: true

  # Tighten the posture without touching code: any tool named here is treated as
  # consequential even if it is not flagged as such in the source.
  extra_gated_tools: []

  # Exempt tools from gating. Deliberately empty. Loosening a safety rule should
  # require an explicit, visible edit, never a default.
  ungated_tools: []
