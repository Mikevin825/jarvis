<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JARVIS" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
  <title>JARVIS</title>
</head>
<body>
  <!-- Pairing screen: shown until a token is stored -->
  <div id="pair" class="screen">
    <div class="pair__orb"></div>
    <h1 class="pair__title">JARVIS</h1>
    <p class="pair__hint">Paste the pairing token shown in the terminal.</p>
    <input id="token-input" type="text" placeholder="pairing token"
           autocomplete="off" autocapitalize="off" spellcheck="false" />
    <button id="pair-btn" type="button">Connect</button>
    <p id="pair-error" class="pair__error"></p>
  </div>

  <!-- Chat screen -->
  <div id="app" class="screen" hidden>
    <header class="bar">
      <span class="bar__dot" id="status-dot"></span>
      <span class="bar__name" id="app-name">JARVIS</span>
      <button id="voice-btn" class="bar__btn" type="button" title="Spoken replies" aria-pressed="true">🔊</button>
      <button id="reset-btn" class="bar__btn" type="button" title="New session">⟲</button>
    </header>

    <main id="log" class="log" aria-live="polite"></main>

    <!-- Confirmation sheet for consequential actions -->
    <div id="confirm" class="confirm" hidden>
      <div class="confirm__card">
        <div class="confirm__title">Approval needed</div>
        <div class="confirm__effect" id="confirm-effect"></div>
        <div class="confirm__detail" id="confirm-detail"></div>
        <div class="confirm__actions">
          <button id="confirm-no" class="btn btn--ghost" type="button">Decline</button>
          <button id="confirm-yes" class="btn" type="button">Approve</button>
        </div>
      </div>
    </div>

    <footer class="composer">
      <button id="mic-btn" class="composer__mic" type="button" title="Hold to talk">🎙</button>
      <textarea id="input" rows="1" placeholder="Message JARVIS…"
                autocomplete="off" autocapitalize="sentences"></textarea>
      <button id="send-btn" class="composer__send" type="button" title="Send">➤</button>
    </footer>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
