<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS — galaxy</title>
    <link rel="stylesheet" href="/src/demo/tokens.css" />
    <link rel="stylesheet" href="/src/demo/demo.css" />
    <link rel="stylesheet" href="/src/demo/labels.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="hud">
      <div class="hud__row">
        <span class="hud__label">state</span>
        <span class="hud__value" id="state-name">idle</span>
      </div>
      <div class="hud__row">
        <span class="hud__label">fps</span>
        <span class="hud__value" id="fps">–</span>
      </div>
      <div class="hud__row">
        <span class="hud__label">link</span>
        <span class="hud__value" id="link">demo</span>
      </div>
    </div>

    <div class="controls">
      <div class="controls__states" id="states" role="radiogroup" aria-label="AI state"></div>
      <div class="controls__toggles">
        <button class="toggle" id="audio-toggle" type="button">audio source: real</button>
        <button class="toggle" id="mic-toggle" type="button">mic: on</button>
        <button class="toggle" id="perf-toggle" type="button">performance: auto</button>
        <button class="toggle" id="motion-toggle" type="button">reduced motion: off</button>
      </div>
    </div>

    <!-- Navigation controls -->
    <div class="nav-controls" id="nav-controls">
      <button class="nav-btn" id="nav-reset" type="button" title="Reset camera (R)">⟲</button>
      <button class="nav-btn" id="nav-zoom-in" type="button" title="Zoom in (+)">+</button>
      <button class="nav-btn" id="nav-zoom-out" type="button" title="Zoom out (−)">−</button>
      <button class="nav-btn" id="nav-help" type="button" title="Help (?)">?</button>
    </div>

    <!-- Help overlay -->
    <div class="nav-help" id="nav-help-panel" style="display:none">
      <div class="nav-help__title">Navigation</div>
      <div class="nav-help__grid">
        <span>Drag</span><span>Rotate camera</span>
        <span>Scroll</span><span>Zoom in/out</span>
        <span>R</span><span>Reset camera</span>
        <span>+/-</span><span>Zoom in/out</span>
        <span>?</span><span>Toggle this help</span>
      </div>
    </div>

    <!-- Theme toggle in a corner, per the spec: a two-option control with icons -->
    <button class="theme-corner" id="theme-toggle" type="button" aria-label="Theme: dark">🌙</button>

    <!-- Screen readers get told the state, since the orb cannot say it. -->
    <div class="sr-only" role="status" aria-live="polite" id="live-region">
      State: idle
    </div>

    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
