<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Living Mind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #8B93A1;
      font-size: 12px;
      z-index: 10;
    }
    #hud .title { color: #D4AF37; font-weight: 600; }
    #hud .stats { text-align: right; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a12; color: #D4AF37;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px; z-index: 100;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud">
    <div class="title">JARVIS — Living Mind</div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="loading">Loading mind map...</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
