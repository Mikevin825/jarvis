<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: #0b0d10; color: #e5e7eb;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; flex: 0 0 auto;
    background: #111418; border-bottom: 1px solid #1f2937;
  }
  header h1 {
    font-size: 13px; margin: 0; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; color: #9ca3af;
  }
  header .spacer { flex: 1; }
  header button {
    background: #1f2937; color: #d1d5db; border: 1px solid #374151;
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  header button:hover { background: #374151; }
  header .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
  }
  header .dot.off { background: #6b7280; box-shadow: none; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .pane + .pane { border-left: 1px solid #1f2937; }
  .pane .label {
    position: absolute; top: 10px; left: 12px; z-index: 5;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: #6b7280; pointer-events: none;
    background: rgba(11,13,16,.72); padding: 3px 8px; border-radius: 4px;
  }
  iframe { flex: 1; width: 100%; height: 100%; border: 0; display: block; }

  .missing {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: #6b7280; font-size: 13px;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane + .pane { border-left: 0; border-top: 1px solid #1f2937; }
  }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot" title="servers"></span>
    <h1>JARVIS</h1>
    <div class="spacer"></div>
    <button onclick="toggleLayout()" title="Swap between side-by-side and stacked">⇄ Layout</button>
    <button onclick="location.reload()" title="Reload both views">↻ Reload</button>
  </header>

  <main id="panels">
    <section class="pane">
      <span class="label">Galaxy</span>
      <iframe id="galaxy" src="/galaxy/" title="JARVIS galaxy"
              allow="autoplay; microphone"></iframe>
    </section>
    <section class="pane">
      <span class="label">Mind</span>
      <iframe id="mind" src="http://127.0.0.1:8792/" title="JARVIS mind map"></iframe>
    </section>
  </main>

<script>
  // The mind map lives on its own port. If it is not up yet, say so inside the
  // pane rather than leaving a blank frame that looks like a broken galaxy.
  var mind = document.getElementById('mind');
  var dot = document.getElementById('dot');
  var stacked = false;

  mind.addEventListener('load', function () {
    var up = false;
    try { up = mind.contentWindow && mind.contentWindow.document.title.length > 0; }
    catch (e) { up = false; }   // cross-origin: assume it loaded
    dot.className = 'dot' + (up ? '' : ' off');
  });

  function toggleLayout() {
    stacked = !stacked;
    document.getElementById('panels').style.gridTemplateColumns = stacked ? '1fr' : '1fr 1fr';
    document.getElementById('panels').style.gridTemplateRows = stacked ? '1fr 1fr' : '';
  }
</script>
</body>
</html>
